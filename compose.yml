version: "3.9"

services:
  qemu:
    image: qemux/qemu
    container_name: qemu
    environment:
      BOOT: "kali"
      RAM_SIZE: "16G"
      CPU_CORES: "8"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389"
    volumes:
      - ./qemu:/storage
    restart: always
    stop_grace_period: 2m
